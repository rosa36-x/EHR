# caliper-benchmarks/benchmark-config.yaml
#
# Full TPS sweep: 10 / 50 / 100 / 200 / 500 (fixed-rate) per operation, to
# find the network's real saturation point rather than stopping at an
# arbitrary tier. Stopped at 500 deliberately (not 1000) -- this runs on a
# single laptop via Docker Compose (all 5 orgs + orderer + CAs sharing one
# machine's CPU/RAM, not distributed hardware)


test:
  name: MedVault Chaincode Benchmark
  description: >
    Throughput/latency benchmark for representative MedVault-X chaincode
    operations (two reads, two writes) across a TPS sweep from 10 to 500,
    with per-container CPU/memory monitoring.
  workers:
    number: 4
  rounds:
    # ── CheckActiveTreatmentRelationship (read) ────────────────────────────
    - label: check_treatment_relationship_10tps
      txNumber: 200
      rateControl: { type: fixed-rate, opts: { tps: 10 } }
      workload: { module: ./workloads/checkTreatmentRelationship.js }

    - label: check_treatment_relationship_50tps
      txNumber: 500
      rateControl: { type: fixed-rate, opts: { tps: 50 } }
      workload: { module: ./workloads/checkTreatmentRelationship.js }

    - label: check_treatment_relationship_100tps
      txNumber: 500
      rateControl: { type: fixed-rate, opts: { tps: 100 } }
      workload: { module: ./workloads/checkTreatmentRelationship.js }

    - label: check_treatment_relationship_200tps
      txNumber: 1000
      rateControl: { type: fixed-rate, opts: { tps: 200 } }
      workload: { module: ./workloads/checkTreatmentRelationship.js }

    - label: check_treatment_relationship_500tps
      txNumber: 1500
      rateControl: { type: fixed-rate, opts: { tps: 500 } }
      workload: { module: ./workloads/checkTreatmentRelationship.js }

    # ── CreateTreatmentRelationship (write) ─────────────────────────────────
    - label: create_treatment_relationship_10tps
      txNumber: 100
      rateControl: { type: fixed-rate, opts: { tps: 10 } }
      workload: { module: ./workloads/createTreatmentRelationship.js }

    - label: create_treatment_relationship_50tps
      txNumber: 300
      rateControl: { type: fixed-rate, opts: { tps: 50 } }
      workload: { module: ./workloads/createTreatmentRelationship.js }

    - label: create_treatment_relationship_100tps
      txNumber: 500
      rateControl: { type: fixed-rate, opts: { tps: 100 } }
      workload: { module: ./workloads/createTreatmentRelationship.js }

    - label: create_treatment_relationship_200tps
      txNumber: 600
      rateControl: { type: fixed-rate, opts: { tps: 200 } }
      workload: { module: ./workloads/createTreatmentRelationship.js }

    - label: create_treatment_relationship_500tps
      txNumber: 800
      rateControl: { type: fixed-rate, opts: { tps: 500 } }
      workload: { module: ./workloads/createTreatmentRelationship.js }

    # ── CreateConsultation (write, PDC) ─────────────────────────────────────
    - label: create_consultation_10tps
      txNumber: 100
      rateControl: { type: fixed-rate, opts: { tps: 10 } }
      workload: { module: ./workloads/createConsultation.js }

    - label: create_consultation_50tps
      txNumber: 300
      rateControl: { type: fixed-rate, opts: { tps: 50 } }
      workload: { module: ./workloads/createConsultation.js }

    - label: create_consultation_100tps
      txNumber: 500
      rateControl: { type: fixed-rate, opts: { tps: 100 } }
      workload: { module: ./workloads/createConsultation.js }

    - label: create_consultation_200tps
      txNumber: 600
      rateControl: { type: fixed-rate, opts: { tps: 200 } }
      workload: { module: ./workloads/createConsultation.js }

    - label: create_consultation_500tps
      txNumber: 800
      rateControl: { type: fixed-rate, opts: { tps: 500 } }
      workload: { module: ./workloads/createConsultation.js }

    # ── HasActiveConsent (cross-org PDC read) ───────────────────────────────
    - label: check_active_consent_10tps
      txNumber: 200
      rateControl: { type: fixed-rate, opts: { tps: 10 } }
      workload: { module: ./workloads/checkActiveConsent.js }

    - label: check_active_consent_50tps
      txNumber: 500
      rateControl: { type: fixed-rate, opts: { tps: 50 } }
      workload: { module: ./workloads/checkActiveConsent.js }

    - label: check_active_consent_100tps
      txNumber: 500
      rateControl: { type: fixed-rate, opts: { tps: 100 } }
      workload: { module: ./workloads/checkActiveConsent.js }

    - label: check_active_consent_200tps
      txNumber: 1000
      rateControl: { type: fixed-rate, opts: { tps: 200 } }
      workload: { module: ./workloads/checkActiveConsent.js }

    - label: check_active_consent_500tps
      txNumber: 1500
      rateControl: { type: fixed-rate, opts: { tps: 500 } }
      workload: { module: ./workloads/checkActiveConsent.js }

monitors:
  resource:
    - module: docker
      options:
        interval: 5
        containers:
          - orderer.medvault.com
          - peer0.hospital.medvault.com
          - peer0.pharmacy.medvault.com
          - peer0.laboratory.medvault.com
          - peer0.governance.medvault.com